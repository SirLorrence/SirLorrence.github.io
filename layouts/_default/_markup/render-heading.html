{{- /* Content files sometimes start with h1s. The page template already owns
       the single h1, so demote content h1s to h2 without rewriting content. */ -}}
{{- $level := .Level -}}
{{- if eq $level 1 }}{{ $level = 2 }}{{ end -}}
<h{{ $level }} id="{{ .Anchor | safeURL }}">{{ .Text | safeHTML }}</h{{ $level }}>
