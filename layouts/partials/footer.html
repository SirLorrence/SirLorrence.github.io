{{- $homeURL := site.Home.RelPermalink -}}

<footer class="home-footer">
  <div class="home-footer__inner">
    <p>© {{ now.Year }} Laurence Sadler</p>
    <nav class="home-footer__nav" aria-label="Footer navigation">
      <a href="{{ "/projects/" | relURL }}">Projects</a>
      <a href="{{ "/posts/" | relURL }}">Blog</a>

    <a class="home-footer__top" href="#top">Back to top</a>
  </div>
</footer>
