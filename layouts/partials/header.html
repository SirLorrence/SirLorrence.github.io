{{- $homeURL := site.Home.RelPermalink -}}
{{- $postsURL := "/posts/" | relURL -}}
<header class="home-header">
  <nav class="home-nav" aria-label="Primary navigation">
    <a class="home-brand" href="{{ $homeURL }}" aria-label="Laurence Sadler, home">
      <span class="home-brand__mark" aria-hidden="true">LS</span>
      <span>Laurence Sadler</span>
    </a>

    <div class="home-nav__sections">
      <a href="{{ if .IsHome }}#work{{ else }}{{ $homeURL }}#work{{ end }}"{{ if eq .Section "projects" }} class="is-active" aria-current="true"{{ end }}><span>01</span> Projects</a>
      <a href="{{ if .IsHome }}#experience{{ else }}{{ $homeURL }}#experience{{ end }}"><span>02</span> Experience</a>
      <a href="{{ if .IsHome }}#about{{ else }}{{ $homeURL }}#about{{ end }}"><span>03</span> About</a>
      <a href="{{ if .IsHome }}#contact{{ else }}{{ $homeURL }}#contact{{ end }}"><span>04</span> Contact</a>
    </div>

    <div class="home-nav__pages">
      <a href="{{ $postsURL }}"{{ if eq .Section "posts" }} class="is-active" aria-current="page"{{ end }}>Blog</a>
    </div>
  </nav>
</header>
