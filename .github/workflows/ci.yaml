name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.126.0
      HUGO_ENVIRONMENT: production
      HUGO_ENV: production
      TZ: America/Los_Angeles
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build without warnings
        run: |
          set -o pipefail
          hugo --gc --minify 2>&1 | tee "${RUNNER_TEMP}/hugo.log"
          if grep -q 'WARN' "${RUNNER_TEMP}/hugo.log"; then
            echo "Hugo emitted warnings; see the build log above."
            exit 1
          fi
